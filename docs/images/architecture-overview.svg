<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <rect width="1100" height="540" rx="12" fill="#0f172a"/>
  <text x="550" y="38" fill="#f8fafc" font-size="18" font-weight="700" text-anchor="middle">Apigee X + Private Cloud Run Multi-Provider LDAP Policy Architecture</text>

  <!-- Apigee X Box -->
  <rect x="240" y="65" width="350" height="445" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="415" y="92" fill="#38bdf8" font-size="15" font-weight="700" text-anchor="middle">Apigee X Runtime (SA: apigee-ldap-invoker)</text>

  <!-- Admin Proxy Subbox -->
  <rect x="260" y="110" width="310" height="150" rx="8" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
  <text x="415" y="132" fill="#e2e8f0" font-size="13" font-weight="700" text-anchor="middle">Proxy 1: ldap-admin-v1 (/v1/ldap-admin)</text>
  <rect x="280" y="148" width="270" height="42" rx="6" fill="#1e3a8a" stroke="#60a5fa"/>
  <text x="415" y="173" fill="#f8fafc" font-size="12" text-anchor="middle">KVM-Put / Get (ldap-providers-kvm)</text>
  <rect x="280" y="202" width="270" height="42" rx="6" fill="#065f46" stroke="#34d399"/>
  <text x="415" y="227" fill="#f8fafc" font-size="12" text-anchor="middle">TargetEndpoint -> /v1/ldap/providers</text>

  <!-- Runtime Proxy Subbox -->
  <rect x="260" y="280" width="310" height="210" rx="8" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
  <text x="415" y="302" fill="#e2e8f0" font-size="13" font-weight="700" text-anchor="middle">Proxy 2: ldap-policy-callout-v1 (Zero KVM)</text>
  <rect x="280" y="316" width="270" height="36" rx="6" fill="#334155"/>
  <text x="415" y="339" fill="#f8fafc" font-size="12" text-anchor="middle">1. BasicAuth + Read x-ldap-provider Header</text>
  <rect x="280" y="362" width="270" height="42" rx="6" fill="#065f46" stroke="#34d399"/>
  <text x="415" y="387" fill="#f8fafc" font-size="12" text-anchor="middle">2. ServiceCallout (GoogleIDToken Aud)</text>
  <rect x="280" y="414" width="270" height="60" rx="6" fill="#334155"/>
  <text x="415" y="439" fill="#f8fafc" font-size="12" text-anchor="middle">3. ExtractVariables (ldap.*) + RaiseFault</text>
  <text x="415" y="458" fill="#94a3b8" font-size="11" text-anchor="middle">4. AssignMessage (X-LDAP-* Headers)</text>

  <!-- Actors Left -->
  <rect x="30" y="155" width="160" height="65" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="110" y="183" fill="#fcd34d" font-size="13" font-weight="700" text-anchor="middle">Admin / CI-CD</text>
  <text x="110" y="203" fill="#cbd5e1" font-size="11" text-anchor="middle">POST /v1/ldap-admin</text>

  <rect x="30" y="350" width="160" height="75" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
  <text x="110" y="378" fill="#d8b4fe" font-size="13" font-weight="700" text-anchor="middle">API Consumer</text>
  <text x="110" y="396" fill="#cbd5e1" font-size="11" text-anchor="middle">x-ldap-provider Header</text>
  <text x="110" y="412" fill="#cbd5e1" font-size="11" text-anchor="middle">+ Credentials / Filter</text>

  <!-- Cloud Run Box -->
  <rect x="650" y="65" width="240" height="340" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="770" y="92" fill="#34d399" font-size="14" font-weight="700" text-anchor="middle">Private Cloud Run (Go)</text>
  <text x="770" y="110" fill="#94a3b8" font-size="11" text-anchor="middle">Aud: ldap-policy-service</text>

  <rect x="670" y="130" width="200" height="65" rx="6" fill="#0f172a" stroke="#475569"/>
  <text x="770" y="155" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">ProviderRegistry (RAM)</text>
  <text x="770" y="175" fill="#94a3b8" font-size="11" text-anchor="middle">Warm LDAPPools by ID</text>

  <rect x="670" y="210" width="200" height="80" rx="6" fill="#0f172a" stroke="#475569"/>
  <text x="770" y="233" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">LDAP Policy Engine</text>
  <text x="770" y="252" fill="#cbd5e1" font-size="11" text-anchor="middle">• Query (RFC 4515 Escape)</text>
  <text x="770" y="268" fill="#cbd5e1" font-size="11" text-anchor="middle">• Auth + Nested AD Groups</text>
  <text x="770" y="284" fill="#cbd5e1" font-size="11" text-anchor="middle">• Write LDIF + Base DN AST</text>

  <!-- External LDAP & Backend -->
  <rect x="935" y="140" width="140" height="130" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="2"/>
  <text x="1005" y="175" fill="#fda4af" font-size="13" font-weight="700" text-anchor="middle">LDAP Directories</text>
  <text x="1005" y="198" fill="#cbd5e1" font-size="11" text-anchor="middle">• forumsys-public</text>
  <text x="1005" y="216" fill="#cbd5e1" font-size="11" text-anchor="middle">• Active Directory</text>
  <text x="1005" y="234" fill="#cbd5e1" font-size="11" text-anchor="middle">• OpenLDAP / Oracle</text>

  <rect x="650" y="430" width="240" height="70" rx="8" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
  <text x="770" y="460" fill="#93c5fd" font-size="13" font-weight="700" text-anchor="middle">Business Backend Target</text>
  <text x="770" y="480" fill="#cbd5e1" font-size="11" text-anchor="middle">Receives X-LDAP-* Headers</text>

  <!-- Arrows -->
  <line x1="190" y1="187" x2="260" y2="187" stroke="#f59e0b" stroke-width="2.5"/>
  <line x1="190" y1="387" x2="260" y2="387" stroke="#a855f7" stroke-width="2.5"/>
  <line x1="550" y1="223" x2="650" y2="165" stroke="#34d399" stroke-width="2.5"/>
  <line x1="550" y1="383" x2="650" y2="250" stroke="#34d399" stroke-width="2.5"/>
  <line x1="890" y1="205" x2="935" y2="205" stroke="#f43f5e" stroke-width="2.5"/>
  <line x1="550" y1="455" x2="650" y2="465" stroke="#60a5fa" stroke-width="2.5"/>
</svg>
